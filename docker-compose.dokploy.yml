version: '3.8'

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: k4ran909/new-api:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - new_api_data:/data
      - new_api_logs:/app/logs
    environment:
      - SQL_DSN=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-ChangeThisPassword123!}@postgres:5432/${POSTGRES_DB:-new_api}
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:-ChangeThisRedisPassword123!}@redis:6379
      - SESSION_SECRET=${SESSION_SECRET:-change_this_random_session_secret_1234567890}
      - TZ=${TZ:-UTC}
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - STREAMING_TIMEOUT=300
      - NODE_NAME=dokploy-node-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - new-api-net

  postgres:
    image: postgres:15-alpine
    container_name: new-api-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisPassword123!}
      POSTGRES_DB: ${POSTGRES_DB:-new_api}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-new_api}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - new-api-net

  redis:
    image: redis:alpine
    container_name: new-api-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-ChangeThisRedisPassword123!}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ChangeThisRedisPassword123!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - new-api-net

volumes:
  new_api_data:
  new_api_logs:
  postgres_data:
  redis_data:

networks:
  new-api-net:
    driver: bridge
